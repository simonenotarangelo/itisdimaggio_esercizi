<html>
<head>
    <title>Modulo di Iscrizione</title>
</head>
<body>
    <h2>Modulo di Iscrizione</h2>
    <form>
        <table>
            <tbody>
                <tr>
                    <td><label for="nome">Nome:</label></td>
                    <td><input type="text" id="nome" name="nome"></td>
                </tr>
                <tr>
                    <td><label for="cognome">Cognome:</label></td>
                    <td><input type="text" id="cognome" name="cognome"></td>
                </tr>
                <tr>
                    <td><label for="data_nascita">Data di Nascita:</label></td>
                    <td><input type="text" id="data_nascita" name="data_nascita"></td>
                </tr>
                <tr>
                    <td><label for="sesso">Sesso:</label></td>
                    <td>
                        <input type="radio" id="maschio" name="sesso" value="Maschio">
                        <label for="maschio">Maschio</label>
                        <input type="radio" id="femmina" name="sesso" value="Femmina">
                        <label for="femmina">Femmina</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="telefono">Telefono:</label></td>
                    <td><input type="tel" id="telefono" name="telefono"></td>
                </tr>
                <tr>
                    <td><label for="provincia">Provincia:</label></td>
                    <td>
                        <select id="provincia" name="provincia">
                            <option value="FG">FOGGIA</option>
                            <option value="TO">TORINO</option>
                            <option value="MI">MILANO</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Preferenza di contatto:</td>
                    <td>
                        <input type="radio" id="posta_ordinaria" name="posta" value="posta ordinaria"> 
                        <label for="posta_ordinaria">Posta Ordinaria</label>
                        <input type="radio" id="posta_elettronica" name="posta" value="posta elettronica">
                        <label for="posta_elettronica">Posta Elettronica</label>
                        <input type="radio" id="contatto_telefonico" name="posta" value="contatto telefonico">
                        <label for="contatto_telefonico">Contatto Telefonico</label>
                    </td>
                </tr>
                <tr>
                    <td>Note:</td>
                    <td>
                        <textarea rows="5" cols="50" name="note">Inserire note</textarea>
                    </td>
                </tr>
            </tbody>
        </table>
        <input type="submit" value="Iscriviti">
    </form>
</body>
</html>
